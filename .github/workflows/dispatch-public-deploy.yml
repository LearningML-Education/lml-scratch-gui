name: Dispatch public deploy

on:
  push:
    tags:
      - "*"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to lml-scratch
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_DISPATCH_TOKEN }}
          TARGET_REPO: LearningML-Education/lml-scratch
          EVENT_TYPE: lml-scratch-deploy
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing PUBLIC_REPO_DISPATCH_TOKEN"
            exit 1
          fi

          payload=$(printf '{"event_type":"%s","client_payload":{"tag":"%s","source_repo":"%s","sha":"%s"}}' \
            "$EVENT_TYPE" "$TAG_NAME" "$SOURCE_REPO" "$SOURCE_SHA")

          curl -f -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$payload"
